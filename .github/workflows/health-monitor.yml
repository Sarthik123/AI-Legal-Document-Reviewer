name: Production and Staging Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  production:
    name: Check production API
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            "https://api.lawyerlens.in/health"

  staging:
    name: Check staging API
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging health
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          if [ -z "$STAGING_API_URL" ]; then
            echo "STAGING_API_URL is not configured; skipping staging check."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            "${STAGING_API_URL%/}/health"
